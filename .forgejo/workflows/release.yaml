name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag_version="${FORGEJO_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Tag $tag_version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Wait for quality
        run: nix develop .#ci --command node .forgejo/scripts/wait-for-quality.js

      - name: Build Linux release asset
        run: |
          nix develop .#ci --command just build
          mkdir -p dist/package/bin dist/package/share/man/man1
          case "$(uname -m)" in
            x86_64|amd64) asset_arch=x86_64 ;;
            aarch64|arm64) asset_arch=aarch64 ;;
            *) asset_arch="$(uname -m)" ;;
          esac
          asset_name="vimdoc-language-server-linux-${asset_arch}"
          cp target/release/vimdoc-language-server "dist/${asset_name}"
          cp "dist/${asset_name}" dist/package/bin/vimdoc-language-server
          cp man/*.1 dist/package/share/man/man1/
          tar -C dist/package -czf "dist/${asset_name}.tar.gz" .
          printf '%s\n' "${asset_name}" > dist/asset-name

      - name: Publish crate dry run
        run: nix develop .#ci --command cargo publish --dry-run --locked

      - name: Publish crate
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          published_version=$(
            nix develop .#ci --command cargo search vimdoc-language-server --limit 1 \
              | sed -n 's/^vimdoc-language-server = "\([^"]*\)".*/\1/p'
          )
          if [ "$published_version" = "$crate_version" ]; then
            echo "vimdoc-language-server $crate_version is already published"
          else
            nix develop .#ci --command cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Configure Forgejo CLI
        run: |
          nix develop .#ci --command tea login delete actions || true
          nix develop .#ci --command tea login add \
            --name actions \
            --url "$FORGEJO_SERVER_URL" \
            --token "$FORGEJO_TOKEN" \
            --no-version-check

      - name: Replace Forgejo release
        run: |
          asset_name="$(cat dist/asset-name)"
          nix develop .#ci --command tea releases delete \
            --login actions \
            --repo "$FORGEJO_REPOSITORY" \
            --confirm "$FORGEJO_REF_NAME" || true
          nix develop .#ci --command tea releases create \
            --login actions \
            --repo "$FORGEJO_REPOSITORY" \
            --tag "$FORGEJO_REF_NAME" \
            --target "$FORGEJO_SHA" \
            --title "$FORGEJO_REF_NAME" \
            --asset "dist/${asset_name}" \
            --asset "dist/${asset_name}.tar.gz"
