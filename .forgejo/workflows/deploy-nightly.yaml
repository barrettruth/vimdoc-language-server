name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for quality
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          nix develop .#ci --command node <<'EOF'
          const required = [
            "quality / Format (push)",
            "quality / Lint (push)",
            "quality / Test (push)",
          ];
          const deadline = Date.now() + 60 * 60 * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchStatuses() {
            const url = `${process.env.SERVER_URL}/api/v1/repos/${process.env.REPOSITORY}/commits/${process.env.SHA}/status`;
            const response = await fetch(url, {
              headers: { Authorization: `token ${process.env.GITHUB_TOKEN}` },
            });
            if (!response.ok) {
              throw new Error(`status API returned ${response.status}`);
            }
            return response.json();
          }

          async function main() {
            while (Date.now() < deadline) {
              const payload = await fetchStatuses();
              const statuses = new Map();
              for (const status of payload.statuses ?? []) {
                if (required.includes(status.context) && !statuses.has(status.context)) {
                  statuses.set(status.context, status.status);
                }
              }

              const missing = required.filter((context) => !statuses.has(context));
              const failed = required.filter((context) => ["error", "failure"].includes(statuses.get(context)));
              const pending = required.filter((context) => statuses.get(context) !== "success");

              if (failed.length > 0) {
                console.error(`Quality checks failed: ${failed.join(", ")}`);
                process.exit(1);
              }
              if (missing.length === 0 && pending.length === 0) {
                console.log("Quality checks passed.");
                process.exit(0);
              }

              console.log(`Waiting for quality checks: ${pending.concat(missing).join(", ")}`);
              await sleep(10000);
            }

            console.error("Timed out waiting for quality checks.");
            process.exit(1);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Build Linux nightly asset
        run: |
          nix develop .#ci --command just build
          mkdir -p dist/package/bin dist/package/share/man/man1
          case "$(uname -m)" in
            x86_64|amd64) asset_arch=x86_64 ;;
            aarch64|arm64) asset_arch=aarch64 ;;
            *) asset_arch="$(uname -m)" ;;
          esac
          asset_name="vimdoc-language-server-linux-${asset_arch}"
          cp target/release/vimdoc-language-server "dist/${asset_name}"
          cp "dist/${asset_name}" dist/package/bin/vimdoc-language-server
          cp man/*.1 dist/package/share/man/man1/
          tar -C dist/package -czf "dist/${asset_name}.tar.gz" .
          printf '%s\n' "${asset_name}" > dist/asset-name

      - name: Move nightly tag
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@users.noreply.git.barrettruth.com"
          git tag -f --no-sign nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - name: Configure Forgejo CLI
        run: |
          nix develop .#ci --command tea login delete actions || true
          nix develop .#ci --command tea login add \
            --name actions \
            --url "${{ github.server_url }}" \
            --token "$GITHUB_TOKEN" \
            --no-version-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace nightly release
        run: |
          asset_name="$(cat dist/asset-name)"
          nix develop .#ci --command tea releases delete \
            --login actions \
            --repo "${{ github.repository }}" \
            --confirm nightly || true
          nix develop .#ci --command tea releases create \
            --login actions \
            --repo "${{ github.repository }}" \
            --tag nightly \
            --target "$GITHUB_SHA" \
            --title "Nightly ($GITHUB_SHA)" \
            --prerelease \
            --asset "dist/${asset_name}" \
            --asset "dist/${asset_name}.tar.gz"
