name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description:
        What problem does this feature solve? What are you trying to do?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've thought about?
